<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>No Shorts for YouTube</title>
  <style>
    :root { color-scheme: dark; }

    body {
      width: 240px;
      margin: 0;
      padding: 18px 20px 16px;
      background: #0f0f0f;
      color: #f1f1f1;
      font: 13px/1.4 system-ui, "Segoe UI", sans-serif;
    }

    h1 {
      margin: 0 0 16px;
      font-size: 13px;
      font-weight: 500;
      color: #aaa;
      letter-spacing: .01em;
    }

    .stats {
      display: flex;
      gap: 24px;
      margin-bottom: 16px;
    }

    .value {
      font-size: 26px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      line-height: 1.1;
    }

    .label {
      margin-top: 2px;
      font-size: 11px;
      color: #888;
    }

    .note {
      padding-top: 12px;
      border-top: 1px solid #272727;
      font-size: 11px;
      color: #717171;
    }
  </style>
</head>
<body>
  <h1>Перехвачено переходов в Shorts</h1>

  <div class="stats">
    <div>
      <div class="value" id="today">—</div>
      <div class="label">сегодня</div>
    </div>
    <div>
      <div class="value" id="total">—</div>
      <div class="label">всего</div>
    </div>
  </div>

  <p class="note">Выключателя нет. Отключить блокировку можно только в chrome://extensions.</p>

  <script src="popup.js"></script>
</body>
</html>
